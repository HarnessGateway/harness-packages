[project]
name = "harness-packages"
version = "4.0.0"
description = "The harness packages that ship with HarnessGateway."
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "harnessgateway @ git+https://github.com/HarnessGateway/harnessgateway",
    "pytest",
    "pytest-asyncio",
    "openai",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["S101"]
